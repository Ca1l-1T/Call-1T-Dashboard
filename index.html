<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALL-1T Dashboard</title>

    <meta name="theme-color" content="#b71c1c">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <script defer src="script.js"></script>
</head>

<body>

<header class="header">

    <h2 id="greeting">Good Morning 👋</h2>

    <p class="mission-title">
        Today's Mission
    </p>

    <h1 id="mission">
        Become stronger than yesterday.
    </h1>

</header>

<main>

<section class="card">

<h3>💪 Workout</h3>

<p id="workoutDay">
Push Day
</p>

<button class="mainButton">
Continue Workout
</button>

</section>


<section class="card">

<h3>🏃 Training</h3>

<p>
Cross Country
</p>

<p>
Baseball Practice
</p>

</section>


<section class="card">

<h3>💧 Water</h3>

<div class="progress">

<div class="progressFill" id="waterFill"></div>

</div>

<p id="waterText">
0 / 8 Cups
</p>

<button class="smallButton" id="waterButton">

+ Drink Water

</button>

</section>


<section class="card">

<h3>😴 Sleep</h3>

<p id="sleepText">

7h 30m

</p>

</section>


<section class="card">

<h3>🔥 Current Streak</h3>

<h1 id="streak">

0 Days

</h1>

</section>

</main>


<nav class="bottomNav">

<button>🏠</button>

<button>💪</button>

<button>📈</button>

<button>⚙️</button>

</nav>

</body>
</html>
